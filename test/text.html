<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beer-text text tests</title>
<style>
  body { margin: 0; padding: 16px; background: #1C4B69; color: #F4F1EA; font: 14px/1.5 ui-monospace, Menlo, monospace; }
  h2 { font: 700 48px/1 Georgia, serif; margin: 0 0 8px; color: #FFFFFF; }
  .pass { color: #7FE8A0; } .fail { color: #FF8A8A; }
</style>
</head>
<body>
<!-- Browser tests for how the overlay reads the heading's text: text-transform with letter-spacing, rebuilding
     when the typography changes, the font check, bubble streams on repeated letters, and two copies of the
     library on one page. Serve the repo root and open /test/text.html in a foreground window (background tabs
     pause animation frames); the title ends in ALL PASS or N FAIL. -->
<div id="stage"></div>
<pre id="out">running...</pre>
<script type="module">
  import { pour } from '../src/beer-text.js';

  var out = document.getElementById('out'), stage = document.getElementById('stage'), results = [], errors = [];
  // Errors from browser extensions (a password manager's script on the page) aren't the library's; anything else fails the case.
  var foreign = function (src) { return /(safari-web-extension|moz-extension|chrome-extension|webkit-masked-url):\/\//.test(src || ''); };
  addEventListener('error', function (e) { if (!foreign(e.filename) && !foreign(e.error && e.error.stack)) errors.push(e.message); });
  addEventListener('unhandledrejection', function (e) { if (!foreign(e.reason && e.reason.stack)) errors.push('rejection: ' + (e.reason && e.reason.message || e.reason) + (e.reason && e.reason.stack ? ' @ ' + String(e.reason.stack).split('\n')[0] : '')); });
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function heading(text, css) { var h = document.createElement('h2'); h.textContent = text; if (css) h.style.cssText = css; stage.appendChild(h); return h; }
  function clipText() { return document.querySelector('svg[data-beer-text="defs"] clipPath text'); }

  async function test(name, fn) {
    var ok = false, note = '';
    try { var r = await fn(); ok = r === true; if (r !== true && r) note = String(r); } catch (e) { note = 'threw: ' + e.message; }
    stage.textContent = '';
    if (errors.length) { ok = false; note += (note ? '; ' : '') + 'uncaught: ' + errors.join(' | '); errors = []; }
    results.push((ok ? 'PASS ' : 'FAIL ') + name + (note ? '  (' + note + ')' : ''));
    out.innerHTML = results.map(function (l) { return '<span class="' + (l[0] === 'P' ? 'pass' : 'fail') + '">' + l.replace(/</g, '&lt;') + '</span>'; }).join('\n');
  }

  await test('letter-spaced capitalize: the letter shapes capitalize each word, not every letter', async function () {
    var h = heading('beer text', 'letter-spacing:0.1em;text-transform:capitalize'), c = pour(h, { autoplay: false });
    await sleep(500);
    var t = clipText(), got = t ? t.textContent : 'no clip';
    c.destroy();
    return got === 'BeerText' ? true : 'letter shapes read "' + got + '" (want "BeerText")';
  });

  await test('lowercase keeps context-dependent letters: final sigma (ΟΣ becomes ος)', async function () {
    var h = heading('ΟΣ', 'text-transform:lowercase'), c = pour(h, { autoplay: false });
    await sleep(500);
    var t = clipText(), got = t ? t.textContent : 'no clip';
    c.destroy();
    return got === 'ος' ? true : 'letter shapes read "' + got + '" (want "ος")';
  });

  await test('capitalize after a line break: each line starts a word, with and without letter-spacing', async function () {
    var got = [];
    for (var css of ['text-transform:capitalize', 'text-transform:capitalize;letter-spacing:0.1em']) {
      var h = heading('', css); h.innerHTML = 'beer<br>text';
      var c = pour(h, { autoplay: false });
      await sleep(500);
      got.push(Array.from(document.querySelectorAll('svg[data-beer-text="defs"] clipPath text')).map(function (t) { return t.textContent; }).join('/'));
      c.destroy(); stage.textContent = '';
    }
    return got.every(function (g) { return g === 'Beer/Text'; }) ? true : 'letter shapes read ' + JSON.stringify(got) + ' (want "Beer/Text" twice)';
  });

  await test('capitalize at a mid-word wrap: the continuation stays lowercase (Bre/wing)', async function () {
    var h = heading('brewing', 'text-transform:capitalize;overflow-wrap:anywhere;width:2.2em'), c = pour(h, { autoplay: false });
    await sleep(500);
    var got = Array.from(document.querySelectorAll('svg[data-beer-text="defs"] clipPath text')).map(function (t) { return t.textContent; });
    c.destroy();
    return got.length > 1 && /^[A-Z]/.test(got[0]) && got.slice(1).every(function (l) { return /^[a-z]/.test(l); }) ? true : 'letter shapes read ' + JSON.stringify(got) + ' (want 2+ lines, only the first capitalized)';
  });

  await test('a smaller font at the same width rebuilds the letter shapes at the new size', async function () {
    var h = heading('Lager', 'width:400px'), c = pour(h, { autoplay: false });
    await sleep(500);
    h.style.fontSize = '24px';
    await sleep(400);
    var t = clipText(), got = t ? t.getAttribute('font-size') : 'no clip';
    c.destroy();
    return got === '24' ? true : 'letter shapes at font-size ' + got + ' (want 24)';
  });

  await test('the font check asks about the heading\'s characters as shown (uppercased)', async function () {
    var asked = [], realLoad = document.fonts.load, realCheck = document.fonts.check;
    document.fonts.load = function (f, t) { asked.push(t || ''); return realLoad.apply(this, arguments); };
    document.fonts.check = function (f, t) { asked.push(t || ''); return realCheck.apply(this, arguments); };
    var h = heading('Système', 'text-transform:uppercase'), c;
    try { c = pour(h, { autoplay: false }); await sleep(500); } finally { document.fonts.load = realLoad; document.fonts.check = realCheck; }
    c.destroy();
    var all = asked.length && asked.every(function (t) { return t.indexOf('SYSTÈME') >= 0 && t.indexOf('Système') < 0; });
    return all ? true : 'text passed to the font API: ' + JSON.stringify(asked);
  });

  // Where bubbles appear on the fizz canvas over a few seconds, as separate clusters of columns.
  async function streamPlaces(h, ms) {
    var cv = h.querySelector('canvas[data-beer-text]'), cx = cv.getContext('2d'), hit = new Uint8Array(cv.width), end = performance.now() + ms;
    while (performance.now() < end) {
      var d = cx.getImageData(0, 0, cv.width, cv.height).data;
      for (var i = 3; i < d.length; i += 4) if (d[i] > 0) hit[((i - 3) / 4) % cv.width] = 1;
      await sleep(100);
    }
    var places = 0, gapRun = Infinity, minGap = cv.width / 12;
    for (var x = 0; x < hit.length; x++) { if (hit[x]) { if (gapRun > minGap) places++; gapRun = 0; } else gapRun++; }
    return places;
  }

  await test('a word of one repeated letter still gets several bubble streams (WWW)', async function () {
    var h = heading('WWW', 'font-size:120px;display:inline-block'), c = pour(h, { autoplay: false });
    await sleep(500);
    var n = await streamPlaces(h, 4000);
    c.destroy();
    return n >= 2 ? true : 'bubbles rose in ' + n + ' place(s) (want at least 2)';
  });

  await test('a control word of different letters gets several bubble streams (Wake)', async function () {
    var h = heading('Wake', 'font-size:120px;display:inline-block'), c = pour(h, { autoplay: false });
    await sleep(500);
    var n = await streamPlaces(h, 4000);
    c.destroy();
    return n >= 2 ? true : 'bubbles rose in ' + n + ' place(s) (want at least 2)';
  });

  await test('two copies of the library on one page never reuse an SVG id', async function () {
    var b = await import('../src/beer-text.js?copy=b'), cc = await import('../src/beer-text.js?copy=c');
    var h1 = heading('Lager'), h2 = heading('Stout'), c1 = b.pour(h1, { autoplay: false }), c2 = cc.pour(h2, { autoplay: false });
    await sleep(500);
    var ids = Array.from(document.querySelectorAll('[id^="beer-text-"]')).map(function (e) { return e.id; });
    var dup = ids.filter(function (x, i) { return ids.indexOf(x) !== i; });
    var mounted = h1.querySelector('svg[data-beer-text]') && h2.querySelector('svg[data-beer-text]');
    c1.destroy(); c2.destroy();
    return mounted && ids.length && !dup.length ? true : 'mounted ' + !!mounted + ', ' + ids.length + ' ids, duplicates: ' + (dup.join(', ') || 'none');
  });

  // Typography the overlay either reproduces exactly or declines, leaving the plain heading (review group C).
  function shapes() { return Array.from(document.querySelectorAll('svg[data-beer-text="defs"] clipPath text')); }
  async function mounted(text, css, html) {
    var h = heading(text, css); if (html) h.innerHTML = html;
    var c = pour(h, { autoplay: false });
    await sleep(500);
    return { h: h, c: c, overlay: !!h.querySelector('svg[data-beer-text]') };
  }
  // Where the real text put a character, relative to the heading's padding box, for the k-th character of a string.
  function realLeft(h, node, k) { var r = document.createRange(); r.setStart(node, k); r.setEnd(node, k + 1); var hr = h.getBoundingClientRect(); return r.getClientRects()[0].left - hr.left - h.clientLeft; }

  await test('decomposed accent (e + combining grave) stays on its letter, with and without letter-spacing', async function () {
    var got = [];
    for (var css of ['', 'letter-spacing:0.1em']) {
      var m = await mounted('Système', css);
      got.push(shapes().map(function (t) { return t.textContent.normalize('NFC'); }).join('/'));
      m.c.destroy(); stage.textContent = '';
    }
    return got.every(function (g) { return g === 'Système'; }) ? true : 'letter shapes read ' + JSON.stringify(got) + ' (want "Système" twice)';
  });

  await test('letter-spaced lowercase keeps the final sigma (ΟΣ becomes ος)', async function () {
    var m = await mounted('ΟΣ', 'text-transform:lowercase;letter-spacing:0.1em'), got = shapes().map(function (t) { return t.textContent; }).join('/');
    m.c.destroy();
    return got === 'ος' ? true : 'letter shapes read "' + got + '"';
  });

  await test('right-to-left text keeps the plain heading', async function () {
    var a = await mounted('שלום בירה', 'direction:rtl'), oa = a.overlay, ca = plainText(a.h); a.c.destroy(); stage.textContent = '';
    var b = await mounted('Beer שלום', ''), ob = b.overlay, cb = plainText(b.h); b.c.destroy();
    return !oa && !ob && ca && cb ? true : 'overlay on rtl heading ' + oa + ', on mixed heading ' + ob + ', text visible ' + ca + '/' + cb;
  });
  function plainText(h) { return h.style.color === '' && h.style.webkitTextFillColor === ''; }

  await test('a scaled ancestor: the letter shapes match an unscaled copy', async function () {
    var css = 'letter-spacing:0.1em;width:400px', xs = [];
    for (var wrap of ['', 'transform:scale(0.5)']) {
      stage.style.cssText = wrap; stage.style.transformOrigin = '0 0';
      var m = await mounted('Lager', css), ts = shapes()[0].querySelectorAll('tspan');
      xs.push(+ts[ts.length - 1].getAttribute('x'));
      m.c.destroy(); stage.textContent = ''; stage.style.cssText = '';
    }
    return Math.abs(xs[0] - xs[1]) < 1 ? true : 'last letter at x ' + xs[1] + ' scaled vs ' + xs[0] + ' unscaled';
  });

  await test('a rotated or mirrored ancestor keeps the plain heading', async function () {
    var got = [];
    for (var wrap of ['transform:rotate(10deg)', 'transform:scaleX(-1)']) {
      stage.style.cssText = wrap;
      var m = await mounted('Lager', '');
      got.push(m.overlay && wrap); m.c.destroy(); stage.textContent = ''; stage.style.cssText = '';
    }
    got = got.filter(Boolean);
    return !got.length ? true : 'overlay drawn under ' + got.join(', ');
  });

  await test('preserved spaces, word-spacing and justified lines: each letter where the real one is', async function () {
    var bad = [];
    for (var cfg of [['Big   Beer', 'white-space:pre', 6], ['Big Beer', 'word-spacing:0.6em', 4], ['Big Beer Hall Stout', 'text-align:justify;width:6.5em', 4]]) {
      var m = await mounted(cfg[0], cfg[1]), real = realLeft(m.h, m.h.firstChild, cfg[2]);
      var ts = Array.from(document.querySelectorAll('svg[data-beer-text="defs"] clipPath tspan')).filter(function (t) { return t.textContent === 'B'; });
      var x = ts.length > 1 ? +ts[1].getAttribute('x') : NaN;
      if (!(Math.abs(x - real) < 1)) bad.push(cfg[1] + ': second B at ' + x + ', real ' + real.toFixed(1));
      m.c.destroy(); stage.textContent = '';
    }
    return !bad.length ? true : bad.join('; ');
  });

  await test('small caps keep the plain heading', async function () {
    var m = await mounted('Lager', 'font-variant:small-caps'), o = m.overlay; m.c.destroy();
    return !o ? true : 'overlay drawn over small caps';
  });

  await test('a block element at the end of the heading does not move the baseline', async function () {
    var ys = [];
    for (var html of ['Lager', 'Lager<span style="display:block;height:0"></span>']) {
      var m = await mounted('', '', html);
      ys.push(+shapes()[0].getAttribute('y')); m.c.destroy(); stage.textContent = '';
    }
    return Math.abs(ys[0] - ys[1]) < 0.5 ? true : 'baseline at ' + ys[1] + ' with the block, ' + ys[0] + ' without';
  });

  var fails = results.filter(function (l) { return l[0] === 'F'; }).length;
  document.title = 'beer-text text: ' + (fails ? fails + ' FAIL' : 'ALL PASS');
  results.push('\n' + (fails ? fails + ' FAIL' : 'ALL PASS'));
  out.innerHTML += '\n\n' + (fails ? fails + ' FAIL' : 'ALL PASS');
  if (/report/.test(location.search)) fetch('/__report?' + encodeURIComponent(navigator.userAgent + '\n' + results.join('\n'))).catch(function () {});
</script>
</body>
</html>
