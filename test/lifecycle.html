<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beer-text lifecycle tests</title>
<style>
  body { margin: 0; padding: 16px; background: #1C4B69; color: #F4F1EA; font: 14px/1.5 ui-monospace, Menlo, monospace; }
  h2 { font: 700 48px/1 Georgia, serif; margin: 0 0 8px; color: #FFFFFF; }
  .pass { color: #7FE8A0; } .fail { color: #FF8A8A; }
</style>
</head>
<body>
<!-- Browser tests for the controller's lifecycle: failure recovery, early controls, one controller per heading,
     and accessibility settings that change while the page is open. Serve the repo root (python3 -m http.server)
     and open /test/lifecycle.html; the title ends in ALL PASS or N FAIL. -->
<div id="stage"></div>
<pre id="out">running...</pre>
<script type="module">
  import { pour } from '../src/beer-text.js';

  var out = document.getElementById('out'), stage = document.getElementById('stage'), results = [], errors = [];
  // Errors from browser extensions (a password manager's script on the page) aren't the library's; anything else fails the case.
  // Judged by where the error was raised: the error's file, or the URL of a rejection's first stack frame (a frame
  // line is "name@url" in Firefox and Safari, "    at ... url" in Chrome; a message header never counts).
  var foreign = function (src) { return /^(safari-web-extension|moz-extension|chrome-extension|webkit-masked-url):\/\//.test(src || ''); };
  var origin = function (stack) {
    var lines = String(stack || '').split('\n');
    for (var i = 0; i < lines.length; i++) {
      var f = /^[^\s@]*@([a-z-]+:\/\/\S+)/.exec(lines[i]) || /^\s+at (?:.*\()?([a-z-]+:\/\/[^\s)]+)/.exec(lines[i]);
      if (f) return f[1];
    }
    return '';
  };
  // "Script error." with no file is the muted form of an error from a script on another origin; this page's own
  // module is same-origin, so its errors always carry their file.
  addEventListener('error', function (e) { if (!foreign(e.filename) && !(!e.filename && e.message === 'Script error.')) errors.push(e.message); });
  addEventListener('unhandledrejection', function (e) { if (!foreign(origin(e.reason && e.reason.stack))) errors.push('rejection: ' + (e.reason && e.reason.message || e.reason) + (e.reason && e.reason.stack ? ' @ ' + String(e.reason.stack).split('\n')[0] : '')); });
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function within(p, ms) { return Promise.race([p.then(function () { return true; }), sleep(ms).then(function () { return false; })]); }
  function heading(text) { stage.textContent = ''; var h = document.createElement('h2'); h.textContent = text || 'Lager'; stage.appendChild(h); return h; }
  function overlays(h) { return h.querySelectorAll('[data-beer-text]').length; }
  function plain(h) { return h.style.color === '' && h.style.webkitTextFillColor === '' && overlays(h) === 0; }

  // Media queries the tests can flip: matchMedia is swapped for fakes while a test runs.
  var realMM = window.matchMedia, mqs = {};
  function fakeMQ(media) {
    var ls = [];
    return { media: media, matches: false,
      addEventListener: function (t, f) { ls.push(f); }, removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { ls.push(f); }, removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      set: function (v) { this.matches = v; var e = { matches: v, media: media }; ls.slice().forEach(function (f) { f(e); }); },
      listeners: function () { return ls.length; } };
  }
  function fakeMedia() {
    mqs = {};
    window.matchMedia = function (q) { if (!mqs[q]) mqs[q] = fakeMQ(q); return mqs[q]; };
    return { reduce: window.matchMedia('(prefers-reduced-motion: reduce)'), forced: window.matchMedia('(forced-colors: active)') };
  }

  async function test(name, fn) {
    var ok = false, note = '';
    try { var r = await fn(); ok = r === true; if (r !== true && r) note = String(r); } catch (e) { note = 'threw: ' + e.message; }
    window.matchMedia = realMM;
    stage.textContent = '';
    if (errors.length) { ok = false; note += (note ? '; ' : '') + 'uncaught: ' + errors.join(' | '); errors = []; }
    results.push((ok ? 'PASS ' : 'FAIL ') + name + (note ? '  (' + note + ')' : ''));
    out.innerHTML = results.map(function (l) { return '<span class="' + (l[0] === 'P' ? 'pass' : 'fail') + '">' + l.replace(/</g, '&lt;') + '</span>'; }).join('\n');
  }

  await test('two pours on one heading: one overlay, and the text comes back after both are destroyed', async function () {
    var h = heading(), a = pour(h, { autoplay: false });
    await sleep(500);
    var b = pour(h, { autoplay: false });
    await sleep(500);
    var n = overlays(h);
    a.destroy(); b.destroy();
    return n === 2 && plain(h) ? true : 'overlay nodes while mounted ' + n + ' (want 2: one svg, one canvas), color after "' + h.style.color + '"';
  });

  await test('forced colors: replay() does not draw an overlay', async function () {
    var m = fakeMedia(); m.forced.matches = true;
    var h = heading(), c = pour(h);
    c.replay();
    await sleep(500);
    var ok = plain(h), why = 'overlay nodes ' + overlays(h) + ', color "' + h.style.color + '"';
    c.destroy();
    return ok ? true : why;
  });

  await test('forced colors switched on later: the plain heading comes back', async function () {
    var m = fakeMedia(), h = heading(), c = pour(h, { autoplay: false });
    await sleep(500);
    if (!overlays(h)) return 'never mounted';
    m.forced.set(true);
    await sleep(100);
    var ok = plain(h), why = 'overlay nodes ' + overlays(h) + ', color "' + h.style.color + '"';
    c.destroy();
    return ok ? true : why;
  });

  await test('reduced motion switched on mid-pour: the pour stops at once', async function () {
    var m = fakeMedia(), h = heading(), c = pour(h, { autoplay: false });
    await sleep(500);
    var p = c.replay();
    await sleep(400);
    m.reduce.set(true);
    var stopped = await within(p, 300);
    c.destroy();
    return stopped ? true : 'still pouring 300 ms after reduced motion turned on';
  });

  await test('destroy() removes the media listeners', async function () {
    var m = fakeMedia(), h = heading(), c = pour(h, { autoplay: false });
    await sleep(500);
    var added = m.reduce.listeners() + m.forced.listeners();
    c.destroy();
    var left = m.reduce.listeners() + m.forced.listeners();
    return added === 2 && left === 0 ? true : added + ' listeners added (want 2), ' + left + ' left';
  });

  await test('finish() before the first draw shows the full pint without pouring', async function () {
    var h = heading(), c = pour(h);
    var p = c.finish();
    var quick = await within(p, 1200);
    var n = overlays(h);
    c.destroy();
    return quick && n === 2 ? true : 'settled within 1.2 s: ' + quick + ', overlay nodes ' + n;
  });

  await test('replay() before the font check finishes pours once, uncut', async function () {
    var h = heading(), c = pour(h, { autoplay: false });
    var p = c.replay();
    var cut = await within(p, 1500), n = overlays(h), done = await within(p, 8000);
    c.destroy();
    return !cut && done && n === 2 ? true : 'ended within 1.5 s: ' + cut + ', ended within 9.5 s: ' + done + ', overlay nodes ' + n;
  });

  // Fault injection: drawing throws. The plain heading must come back and finished must settle.
  var injected = 0;
  function breakDrawing() {
    var orig = SVGElement.prototype.setAttribute;
    SVGElement.prototype.setAttribute = function (k, v) { if (k === 'd' && this.closest && this.closest('svg[data-beer-text]')) { injected++; throw new Error('injected'); } return orig.call(this, k, v); };
    return function () { SVGElement.prototype.setAttribute = orig; };
  }
  function quiet() { var e = console.error; console.error = function () {}; return function () { console.error = e; }; }

  await test('drawing fails as the pour starts: plain heading, finished settles', async function () {
    var h = heading(), c = pour(h, { autoplay: false });
    await sleep(500);
    var fix = breakDrawing(), hush = quiet(), p;
    try { p = c.replay(); } catch (e) { /* the old code threw out of replay() */ }
    fix();
    await sleep(100);
    hush();
    var settled = p ? await within(p, 300) : false, ok = plain(h), fired = injected; injected = 0;
    c.destroy();
    return ok && settled && fired ? true : 'plain ' + ok + ', settled ' + settled + ', error injected ' + fired + ' times';
  });

  await test('drawing fails mid-pour (in an animation frame): plain heading, finished settles', async function () {
    var h = heading(), c = pour(h, { autoplay: false });
    await sleep(500);
    var p = c.replay();
    await sleep(600);
    var fix = breakDrawing(), hush = quiet();
    await sleep(200);
    fix(); hush();
    var settled = await within(p, 300), ok = plain(h), fired = injected; injected = 0;
    c.destroy();
    return ok && settled && fired ? true : 'plain ' + ok + ', settled ' + settled + ', error injected ' + fired + ' times';
  });

  // A resize queues a redraw for the next frame; a control called in between must win over it.
  function frames(n) { return new Promise(function (r) { (function f(k) { if (!k) return r(); requestAnimationFrame(function () { f(k - 1); }); })(n); }); }
  async function queuedRedraw(h) { h.style.width = '300px'; await frames(2); }   // the redraw is queued, not yet drawn

  await test('replay() while a resize redraw is queued pours uncut', async function () {
    var h = heading(); h.style.width = '400px';
    var c = pour(h, { autoplay: false });
    await sleep(500);
    await queuedRedraw(h);
    var p = c.replay();
    var cut = await within(p, 1500), done = await within(p, 8000);
    c.destroy();
    return !cut && done ? true : 'ended within 1.5 s: ' + cut + ', ended within 9.5 s: ' + done;
  });

  await test('guard: replay() then finish() while a redraw is queued settles on the full pint', async function () {
    var h = heading(); h.style.width = '400px';
    var c = pour(h, { autoplay: false });
    await sleep(500);
    await queuedRedraw(h);
    c.replay(); var p = c.finish();
    var quick = await within(p, 500);
    await sleep(1500);
    var later = c.finished === p, n = overlays(h);
    c.destroy();
    return quick && later && n === 2 ? true : 'settled within 0.5 s: ' + quick + ', no new pour started after: ' + later + ', overlay nodes ' + n;
  });

  await test('reduced motion switched on while waiting to scroll into view: the full pint shows', async function () {
    var m = fakeMedia(), h = heading(); h.style.marginTop = '300vh';
    var c = pour(h);
    await sleep(500);
    m.reduce.set(true);
    var shown = await within(c.finished, 1000), n = overlays(h);
    c.destroy();
    return shown && n === 2 ? true : 'settled within 1 s: ' + shown + ', overlay nodes ' + n;
  });

  await test('the font loader throws: plain heading, finished settles, no uncaught error', async function () {
    var real = document.fonts.load;
    document.fonts.load = function () { throw new Error('font check broken'); };
    var h = heading(), c, settled, ok;
    try { c = pour(h); settled = await within(c.finished, 1000); ok = plain(h); } finally { document.fonts.load = real; }
    c.destroy();
    return settled && ok ? true : 'settled ' + settled + ', plain ' + ok;
  });

  await test('the font never finishes loading: plain heading, finished settles', async function () {
    var real = document.fonts.load;
    document.fonts.load = function () { return new Promise(function () {}); };
    var h = heading(), c, settled, ok;
    try { c = pour(h); settled = await within(c.finished, 4000); ok = plain(h); } finally { document.fonts.load = real; }
    c.destroy();
    return settled && ok ? true : 'settled within 4 s: ' + settled + ', plain ' + ok;
  });

  await test('destroy() leaves nothing behind', async function () {
    var h = heading(), c = pour(h, { autoplay: false });
    await sleep(500);
    c.destroy();
    return plain(h) && !document.querySelector('svg[data-beer-text="defs"]') ? true : 'leftovers';
  });

  // Release audits (2026-10-16).
  await test('two copies of the library on one heading: one overlay, and the text comes back after both are destroyed', async function () {
    var a = await import('../src/beer-text.js?copy=la'), b = await import('../src/beer-text.js?copy=lb');
    var h = heading(), c1 = a.pour(h, { autoplay: false }), c2 = b.pour(h, { autoplay: false });
    await sleep(500);
    var n = h.querySelectorAll('svg[data-beer-text]').length;
    c1.destroy(); c2.destroy();
    return n === 1 && plain(h) ? true : n + ' overlays, plain after destroy: ' + plain(h);
  });

  await test('replay() while the heading is off screen shows the full pint instead of pouring unseen', async function () {
    var h = heading(); h.style.marginTop = '300vh';
    var c = pour(h, { autoplay: false });
    await sleep(500);
    var quick = await within(c.replay(), 600), mountedOk = overlays(h) > 0;
    c.destroy();
    return quick && mountedOk ? true : 'settled within 600 ms: ' + quick + ', overlay ' + mountedOk;
  });

  await test('an inline !important color: hidden while mounted, restored with its priority after destroy()', async function () {
    var s = document.createElement('style'); s.textContent = '#imp-h { color: rgb(0, 0, 255) !important; }'; document.head.appendChild(s);
    var h = heading(); h.id = 'imp-h'; h.style.setProperty('color', 'rgb(255, 0, 0)', 'important');
    var c = pour(h, { autoplay: false });
    await sleep(500);
    var during = getComputedStyle(h).color;
    c.destroy();
    var after = getComputedStyle(h).color, prio = h.style.getPropertyPriority('color');
    s.remove();
    return during === 'rgba(0, 0, 0, 0)' && after === 'rgb(255, 0, 0)' && prio === 'important' ? true
      : 'mounted ' + during + ', after ' + after + ' (priority "' + prio + '")';
  });

  await test('a selector string instead of an element: a TypeError that names beer-text', async function () {
    try { pour('#title'); } catch (e) { return e instanceof TypeError && /beer-text/.test(e.message) ? true : 'threw ' + e.name + ': ' + e.message; }
    return 'did not throw';
  });

  await test('an invalid head value falls back to the default and the pour still finishes', async function () {
    var h = heading(), c = pour(h, { autoplay: false, head: 'tall' });
    await sleep(500);
    var done = await within(c.replay(), 8000), ok = overlays(h) > 0;
    c.destroy();
    return done && ok ? true : 'finished within 8 s: ' + done + ', overlay ' + ok;
  });

  var fails = results.filter(function (l) { return l[0] === 'F'; }).length;
  document.title = 'beer-text lifecycle: ' + (fails ? fails + ' FAIL' : 'ALL PASS');
  results.push('\n' + (fails ? fails + ' FAIL' : 'ALL PASS'));
  out.innerHTML += '\n\n' + (fails ? fails + ' FAIL' : 'ALL PASS');
  // With ?report, the results also go to the server as a request it logs (the page must be in a foreground
  // window: background tabs pause animation frames and these tests time real pours).
  if (/report/.test(location.search)) fetch('/__report?' + encodeURIComponent(navigator.userAgent + '\n' + results.join('\n'))).catch(function () {});
</script>
</body>
</html>
